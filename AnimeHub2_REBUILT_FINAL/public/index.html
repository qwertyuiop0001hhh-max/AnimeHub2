<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime Hub 2</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f7f5ff;color:#19142b}button,input{font:inherit}.wrap{width:min(1150px,calc(100% - 20px));margin:auto}.top{position:sticky;top:0;z-index:10;background:#ffffffdd;backdrop-filter:blur(14px);border-bottom:1px solid #e9e3f8}.nav{min-height:65px;display:flex;align-items:center;gap:18px}.brand{font-weight:900;font-size:18px}.brand span{color:#7254ff}.links{display:flex;gap:18px;flex:1}.links a{font-size:12px;color:#756d86;text-decoration:none}.btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#7254ff,#9a7cff);color:white;font-weight:800;cursor:pointer}.secondary{background:white;color:#7254ff;border:1px solid #ded5f5}.hero{margin-top:20px;padding:32px;border-radius:26px;background:linear-gradient(135deg,#fff,#eee9ff);display:grid;grid-template-columns:1fr 360px;gap:20px}.hero h1{font-size:55px;line-height:1;margin:15px 0}.hero h1 span{color:#7254ff}.art{min-height:280px;border-radius:20px;background:linear-gradient(135deg,#25165b,#7658ed);display:grid;place-items:center;color:white;font-size:75px;font-weight:900}.section{padding:32px 0}.search{display:flex;gap:8px;background:white;padding:10px;border:1px solid #e6def8;border-radius:15px}.search input{flex:1;border:0;outline:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:14px}.card{background:white;border:1px solid #e7e1f5;border-radius:17px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-5px)}.poster{height:275px}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:11px}.title{font-weight:900;font-size:13px}.meta{font-size:10px;color:#81798f;margin-top:6px}.modal,.dev{position:fixed;inset:0;background:#160d2d99;backdrop-filter:blur(8px);z-index:30;display:none;align-items:center;justify-content:center;padding:12px}.open{display:flex}.box{background:white;border-radius:22px;padding:20px;width:min(800px,100%);max-height:92vh;overflow:auto}.close{float:right;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}.episodes{display:flex;gap:7px;flex-wrap:wrap}.ep{padding:9px 11px;border:1px solid #e4dcf5;border-radius:10px;background:white;cursor:pointer}.has{color:#7254ff;border-color:#bbaaff}.pattern{display:grid;grid-template-columns:repeat(3,55px);gap:20px;justify-content:center;margin:25px}.dot{width:55px;height:55px;border-radius:50%;border:3px solid #dcd4f5;background:white}.dot.on{background:#7254ff;border-color:#7254ff}.devrow{display:flex;justify-content:space-between;align-items:center;border:1px solid #e8e2f5;padding:11px;border-radius:13px;margin:8px 0}.upload{margin-top:15px;padding:14px;border:1px dashed #bcaef0;border-radius:14px}.upload input{padding:9px;border:1px solid #ddd4f3;border-radius:9px;max-width:100%}@media(max-width:750px){.links{display:none}.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.poster{height:220px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.hero h1{font-size:42px}}
</style></head><body>
<header class="top"><div class="wrap nav"><div class="brand"><span>アニメ</span> HUB 2</div><nav class="links"><a href="#catalog">Каталог</a><a href="#recommend">Рекомендации</a></nav><button class="btn secondary" id="dev">⚙ Режим разработчика</button></div></header>
<main class="wrap"><section class="hero"><div><b style="color:#7254ff">ANIME HUB 2</b><h1>Твой мир<br><span>аниме.</span></h1><p>Рабочий каталог с локальными постерами, сезонами, сериями и панелью разработчика.</p><button class="btn" onclick="document.querySelector('#catalog').scrollIntoView()">🔎 Открыть каталог</button></div><div class="art">アニメ</div></section>
<section class="section" id="catalog"><h2>Найти аниме</h2><div class="search"><input id="q" placeholder="Название..."></div><div class="grid" id="grid"></div></section>
<section class="section" id="recommend"><h2>Рекомендации</h2><div class="grid" id="rec"></div></section></main><footer class="wrap" style="padding:25px 0 50px;color:#81798f">систр типа аиша</footer>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="modal.classList.remove('open')">×</button><div id="info"></div></div></div>
<div class="dev" id="dm"><div class="box"><button class="close" onclick="dm.classList.remove('open')">×</button><div id="login"><h2>Режим разработчика</h2><p>Соедини точки графическим ключом.</p><div class="pattern" id="pat"></div><div id="msg" style="text-align:center;color:#d45b78"></div></div><div id="panel" hidden><h2>Панель разработчика</h2><div id="list"></div><div id="edit"></div></div></div></div>
<script>
let A=[],V={},token="",path=[];
const $=x=>document.querySelector(x);
async function init(){A=await fetch("/api/anime").then(r=>r.json());V=await fetch("/api/videos").then(r=>r.json());draw(A)}
function card(a){return `<div class="card" onclick="openA(${a.id})"><div class="poster"><img src="${a.poster}" alt="${a.title}"></div><div class="body"><div class="title">${a.title}</div><div class="meta">★ ${a.rating} · ${a.genres}</div></div></div>`}
function draw(x){grid.innerHTML=x.map(card).join("");rec.innerHTML=A.slice(5,9).map(card).join("")}
q.oninput=e=>draw(A.filter(a=>a.title.toLowerCase().includes(e.target.value.toLowerCase())));
function openA(id){let a=A.find(x=>x.id===id),h=`<h2>${a.title}</h2><img src="${a.poster}" style="width:145px;border-radius:12px"><p>${a.description}</p><h3>Сезон 1</h3><div class="episodes">`;for(let e=1;e<=a.episodes;e++){let v=V[`${id}:1:${e}`];h+=`<button class="ep ${v?'has':''}" ${v?`onclick="play('${v.url}','${a.title}')"`:""}>Серия ${e} ${v?'▶':'· нет видео'}</button>`}info.innerHTML=h+"</div>";modal.classList.add("open")}
function play(u,t){info.innerHTML=`<button class="btn secondary" onclick="openA(${A.find(a=>a.title===t).id})">← Назад</button><h2>${t}</h2><video src="${u}" controls autoplay playsinline style="width:100%;margin-top:15px;border-radius:14px"></video>`}
dev.onclick=()=>{dm.classList.add("open");token?showPanel():setup()};
function setup(){path=[];msg.textContent="";pat.innerHTML="";for(let i=1;i<=9;i++){let b=document.createElement("button");b.className="dot";b.onclick=()=>{if(!path.includes(i)){path.push(i);b.classList.add("on");login()}};pat.appendChild(b)}}
async function login(){if(path.length<5)return;let r=await fetch("/api/dev/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pattern:path.join("-")})});if(r.ok){token=(await r.json()).token;showPanel()}else{path=[];document.querySelectorAll(".dot").forEach(d=>d.classList.remove("on"));msg.textContent="Неверный ключ"}}
function showPanel(){login.hidden=true;panel.hidden=false;list.innerHTML=A.map(a=>`<div class="devrow"><b>${a.title}</b><button class="btn secondary" onclick="edit(${a.id})">Сезон 1 →</button></div>`).join("")}
function edit(id){let a=A.find(x=>x.id===id);edit.innerHTML=`<div class="upload"><b>${a.title}</b><p>Серия: <input id="ep" type="number" min="1" max="${a.episodes}" value="1"></p><input id="file" type="file" accept="video/*"><br><button class="btn" style="margin-top:10px" onclick="save(${id})">💾 Сохранить видео</button><p id="st"></p></div>`}
async function save(id){let f=file.files[0];if(!f){st.textContent="Выбери видео";return}let fd=new FormData();fd.append("video",f);fd.append("animeId",id);fd.append("season",1);fd.append("episode",ep.value);st.textContent="Загрузка...";let r=await fetch("/api/upload",{method:"POST",headers:{Authorization:"Bearer "+token},body:fd});let j=await r.json();if(r.ok){V[`${id}:1:${ep.value}`]=j.video;st.textContent="Сохранено и доступно посетителям."}else st.textContent="Ошибка загрузки"}
init();
</script></body></html>
